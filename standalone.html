    function encodeConfigForUrl(config) {
      if (!config || !config.apiKey || !config.projectId) return '';
      try {
        const payload = JSON.stringify({
          apiKey: config.apiKey,
          authDomain: config.authDomain || `${config.projectId}.firebaseapp.com`,
          projectId: config.projectId,
          storageBucket: config.storageBucket || `${config.projectId}.appspot.com`,
          messagingSenderId: config.messagingSenderId || '',
          appId: config.appId || ''
        });
        return encodeURIComponent(btoa(payload));
      } catch (e) {
        return '';
      }
    }

    function decodeConfigFromUrl(encodedStr) {
      if (!encodedStr) return null;
      try {
        const raw = atob(decodeURIComponent(encodedStr));
        const parsed = JSON.parse(raw);
        if (parsed && parsed.apiKey && parsed.projectId) {
          return parsed;
        }
      } catch (e) {}
      return null;
    }

    function generateShareableSyncLink(config) {
      const code = encodeConfigForUrl(config);
      if (!code) return window.location.href.split('?')[0];
      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?fb_cfg=${code}`;
    }

    function getStoredFirebaseConfig() {
      // 1. Check URL query parameters / hash first (for seamless one-click multi-device sharing)
      try {
        const urlParams = new URLSearchParams(window.location.search);
        let configFromUrl = null;

        const fbCfgEncoded = urlParams.get('fb_cfg');
        if (fbCfgEncoded) {
          configFromUrl = decodeConfigFromUrl(fbCfgEncoded);
        }

        if (!configFromUrl) {
          const qApiKey = urlParams.get('apiKey');
          const qProjectId = urlParams.get('projectId');
          if (qApiKey && qProjectId) {
            configFromUrl = {
              apiKey: qApiKey,
              authDomain: urlParams.get('authDomain') || `${qProjectId}.firebaseapp.com`,
              projectId: qProjectId,
              storageBucket: urlParams.get('storageBucket') || `${qProjectId}.appspot.com`,
              messagingSenderId: urlParams.get('messagingSenderId') || "",
              appId: urlParams.get('appId') || ""
            };
          }
        }

        if (configFromUrl && configFromUrl.apiKey && configFromUrl.projectId) {
          localStorage.setItem("aerofatigue_firebase_config_v1", JSON.stringify(configFromUrl));
          // Clean up query param from address bar so URL remains clean
          if (window.history && window.history.replaceState) {
            const cleanUrl = window.location.pathname + window.location.hash;
            window.history.replaceState({}, document.title, cleanUrl);
          }
          return configFromUrl;
        }
      } catch (e) {
        console.warn("Could not check URL parameters for Firebase config:", e);
      }

      // 2. Check local storage
      try {
        const saved = localStorage.getItem("aerofatigue_firebase_config_v1");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.projectId && parsed.apiKey) {
            return parsed;
          }
        }
      } catch (e) {}

      // 3. Fallback to hardcoded default config if specified in source
      if (DEFAULT_FIREBASE_CONFIG.projectId && DEFAULT_FIREBASE_CONFIG.apiKey) {
        return DEFAULT_FIREBASE_CONFIG;
      }
      return null;
    }

    function parseFirebaseConfigInput(rawInput) {
      if (!rawInput || typeof rawInput !== 'string') return null;
      const str = rawInput.trim();

      // Case 1: Pure API Key (e.g. AIzaSy...)
      if (/^AIzaSy[A-Za-z0-9_\-]{30,}/.test(str)) {
        return {
          apiKey: str,
          authDomain: "aerofatigue-portal.firebaseapp.com",
          projectId: "aerofatigue-portal",
          storageBucket: "aerofatigue-portal.appspot.com",
          messagingSenderId: "",
          appId: ""

      }

      // Case 2: JSON Object
      try {
        const parsed = JSON.parse(str);
        if (parsed.apiKey && (parsed.projectId || parsed.authDomain)) {
          return {
            apiKey: parsed.apiKey,
            authDomain: parsed.authDomain || "aerofatigue-portal.firebaseapp.com",
            projectId: parsed.projectId || "aerofatigue-portal",
            storageBucket: parsed.storageBucket || "aerofatigue-portal.appspot.com",
            messagingSenderId: parsed.messagingSenderId || "",
            appId: parsed.appId || ""
          };
        }

      // Case 3: JS snippet (const firebaseConfig = { ... })

    // Auto-Calculate Consecutive Duty Days
    function calculateAutoConsecutiveDays(personLogs, targetDate) {
      if (!personLogs || personLogs.length === 0) return 1;
      const sorted = [...personLogs].sort((a, b) => new Date(a.recordDate) - new Date(b.recordDate));
      const targetTime = new Date(targetDate).getTime();
      const pastLogs = sorted.filter(l => new Date(l.recordDate).getTime() <= targetTime);
      if (pastLogs.length === 0) return 1;

      const lastLog = pastLogs[pastLogs.length - 1];
      const lastDate = new Date(lastLog.recordDate);
      const curDate = new Date(targetDate);
      const diffDays = Math.round((curDate - lastDate) / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return lastLog.consecutiveDays || 1;
      else if (diffDays === 1) return (lastLog.consecutiveDays || 1) + 1;
      else return 1;
    }

    function getSystemCurrentTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function getSystemCurrentDate() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function calculateDutyDuration(startStr, endStr) {
      if (!startStr || !endStr) return 8.0;
      try {
        const [sH, sM] = startStr.split(':').map(Number);
        const [eH, eM] = endStr.split(':').map(Number);
        let startMins = sH * 60 + sM;
        let endMins = eH * 60 + eM;
        if (endMins < startMins) endMins += 24 * 60;
        return Math.round(((endMins - startMins) / 60) * 10) / 10;
      } catch (err) {
        return 8.0;
      }
    }

    function calculateFatigueScore(inputs) {
      const sleepHours = Number(inputs.sleepHours) || 7.0;
      const dutyHours = Number(inputs.dutyDuration) || 8.0;
      const shiftType = inputs.shiftType || 'day';
      const consecutiveDays = Number(inputs.consecutiveDays) || 1;
      const workload = inputs.workload || 'medium';

      let sRisk = 0;
      if (sleepHours >= 8.0) sRisk = 0;
      else if (sleepHours >= 7.0) sRisk = 5;
      else if (sleepHours >= 6.0) sRisk = 12;
      else if (sleepHours >= 5.0) sRisk = 20;
      else if (sleepHours >= 4.0) sRisk = 26;
      else sRisk = 30;

      let dutyScore = 0;
      if (dutyHours < 8.0) dutyScore = 0;
      else if (dutyHours < 10.0) dutyScore = 5;
      else if (dutyHours < 12.0) dutyScore = 12;
      else if (dutyHours < 14.0) dutyScore = 20;
      else dutyScore = 25;

      const circScore = shiftType === 'night' ? 20 : 0;

      let consecScore = 0;
      if (consecutiveDays <= 3) consecScore = 0;
      else if (consecutiveDays === 4) consecScore = 3;
      else if (consecutiveDays === 5) consecScore = 6;
      else if (consecutiveDays === 6) consecScore = 8;
      else consecScore = 10;

      const workItem = WORKLOAD_OPTIONS.find(w => w.value === workload) || WORKLOAD_OPTIONS[1];
      const workScore = workItem.points;

      const raw = sRisk + dutyScore + circScore + consecScore + workScore;
      const score = Math.min(100, Math.max(0, raw));

      let category = 'LOW RISK';
      if (score >= 75) category = 'CRITICAL RISK';
      else if (score >= 50) category = 'HIGH RISK';
      else if (score >= 25) category = 'MODERATE RISK';

      return { score, category, breakdown: { sleep: sRisk, duty: dutyScore, shift: circScore, consecutive: consecScore, workload: workScore } };
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const maxDim = 320;
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.82));
            } catch (canvasErr) {
              resolve(e.target.result);
            }
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    }

    function ProfileAvatar({ person, size = "md", className = "" }) {
      const sizeClasses = {
        sm: "w-9 h-9 text-base rounded-xl",
        md: "w-12 h-12 text-xl rounded-2xl",
        lg: "w-16 h-16 text-3xl rounded-2xl",
        xl: "w-24 h-24 text-4xl rounded-3xl"
      }[size] || "w-12 h-12 text-xl rounded-2xl";

      if (person && person.photoUrl) {
        return (
          <img
            src={person.photoUrl}
            alt={person.name}
            className={`${sizeClasses} object-cover border border-cyan-400/60 shadow-[0_0_15px_rgba(0,240,255,0.25)] shrink-0 ${className}`}
          />
        );
      }

      return (
        <div className={`${sizeClasses} bg-gradient-to-br from-[#00F0FF]/20 to-[#1E3264] border border-[#00F0FF]/40 flex items-center justify-center text-[#00F0FF] shrink-0 font-bold shadow-[0_0_15px_rgba(0,240,255,0.2)] ${className}`}>
          {person ? (person.section === 'aircrew' ? '✈' : '🔧') : '👤'}
        </div>
      );
    }

    // Cartesian Fatigue Graph Component
    function CartesianFatigueGraph({ logs, personName }) {
      const [hoveredPoint, setHoveredPoint] = useState(null);

      const sortedLogs = useMemo(() => {
        return [...logs].sort((a, b) => {
          const timeA = new Date(`${a.recordDate}T${a.recordTime || '00:00'}`).getTime();
          const timeB = new Date(`${b.recordDate}T${b.recordTime || '00:00'}`).getTime();
          return timeA - timeB;
        });
      }, [logs]);

      if (sortedLogs.length === 0) {
        return (
          <div className="glass-panel p-8 text-center space-y-3">
            <div className="text-4xl text-slate-600">📈</div>
            <div className="text-sm font-mono font-bold text-slate-300">No fatigue history records available for graph.</div>
            <p className="text-xs text-slate-500">Record a fatigue check-in entry to plot fatigue changes over time.</p>
          </div>
        );
      }

      const width = 860;
      const height = 360;
      const padding = { top: 40, right: 40, bottom: 65, left: 60 };
      const graphW = width - padding.left - padding.right;
      const graphH = height - padding.top - padding.bottom;

      const points = sortedLogs.map((log, index) => {
        const x = sortedLogs.length === 1
          ? padding.left + graphW / 2
          : padding.left + (index / (sortedLogs.length - 1)) * graphW;
        const y = padding.top + graphH - (log.fatigueScore / 100) * graphH;
        return { ...log, x, y };
      });

      const pathD = points.reduce((acc, pt, idx) => {
        return idx === 0 ? `M ${pt.x} ${pt.y}` : `${acc} L ${pt.x} ${pt.y}`;
      }, '');

      const areaD = points.length > 0
        ? `${pathD} L ${points[points.length - 1].x} ${padding.top + graphH} L ${points[0].x} ${padding.top + graphH} Z`
        : '';

      return (
        <div className="glass-panel p-6 space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#1E3264]/70 pb-3">
            <div>
              <h3 className="text-base font-black font-mono uppercase text-slate-100 flex items-center gap-2">
                <span>📈</span> Fatigue Level Over Time (Cartesian Graph)
              </h3>
              <p className="text-xs text-slate-400 font-sans mt-0.5">
                X-Axis: Date &amp; Time Recorded • Y-Axis: Fatigue Level (0–100)
              </p>
            </div>

            <div className="flex items-center gap-3 text-[10px] font-mono">
              <span className="flex items-center gap-1 text-emerald-400"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> 0-24 Low</span>
              <span className="flex items-center gap-1 text-amber-400"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> 25-49 Mod</span>
              <span className="flex items-center gap-1 text-orange-400"><span className="w-2.5 h-2.5 rounded-full bg-orange-500 inline-block"></span> 50-74 High</span>
              <span className="flex items-center gap-1 text-rose-400"><span className="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> 75-100 Crit</span>
            </div>
          </div>

          <div className="relative w-full overflow-x-auto">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto min-w-[650px] font-mono select-none">
              <defs>
                <linearGradient id="fatigueLineGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stopColor="#00F0FF" />
                  <stop offset="50%" stopColor="#3B82F6" />
                  <stop offset="100%" stopColor="#F43F5E" />
                </linearGradient>
                <linearGradient id="fatigueAreaGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="rgba(0, 240, 255, 0.25)" />
                  <stop offset="100%" stopColor="rgba(0, 240, 255, 0.0)" />
                </linearGradient>
              </defs>

              <rect x={padding.left} y={padding.top} width={graphW} height={graphH * 0.25} fill="rgba(244, 63, 94, 0.08)" />
              <rect x={padding.left} y={padding.top + graphH * 0.25} width={graphW} height={graphH * 0.25} fill="rgba(249, 115, 22, 0.05)" />
              <rect x={padding.left} y={padding.top + graphH * 0.50} width={graphW} height={graphH * 0.25} fill="rgba(245, 158, 11, 0.04)" />
              <rect x={padding.left} y={padding.top + graphH * 0.75} width={graphW} height={graphH * 0.25} fill="rgba(16, 185, 129, 0.05)" />

              {[0, 25, 50, 75, 100].map((val) => {
                const yPos = padding.top + graphH - (val / 100) * graphH;
                return (
                  <g key={val}>
                    <line
                      x1={padding.left}
                      y1={yPos}
                      x2={padding.left + graphW}
                      y2={yPos}
                      stroke="rgba(30, 50, 100, 0.6)"
                      strokeDasharray={val === 0 || val === 100 ? "0" : "4 4"}
                      strokeWidth="1"
                    />
                    <text
                      x={padding.left - 12}
                      y={yPos + 4}
                      textAnchor="end"
                      fill={val >= 75 ? "#F43F5E" : val >= 50 ? "#F97316" : val >= 25 ? "#F59E0B" : "#10B981"}
                      fontSize="11"
                      fontWeight="bold"
                    >
                      {val}
                    </text>
                  </g>
                );
              })}

              <text
                x={-(padding.top + graphH / 2)}
                y="18"
                transform="rotate(-90)"
                textAnchor="middle"
                fill="#94A3B8"
                fontSize="11"
                fontWeight="bold"
                letterSpacing="0.08em"
              >
                FATIGUE LEVEL (0–100)
              </text>

              <line
                x1={padding.left}
                y1={padding.top + graphH}
                x2={padding.left + graphW}
                y2={padding.top + graphH}
                stroke="#1E3264"
                strokeWidth="2"
              />

              {sortedLogs.length > 1 && (
                <path d={areaD} fill="url(#fatigueAreaGrad)" />
              )}

              {sortedLogs.length > 1 && (
                <path
                  d={pathD}
                  fill="none"
                  stroke="url(#fatigueLineGrad)"
                  strokeWidth="3.5"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              )}

              {points.map((pt) => {
                const isHovered = hoveredPoint && hoveredPoint.id === pt.id;
                const dotColor = pt.fatigueScore >= 75 ? '#F43F5E' : pt.fatigueScore >= 50 ? '#F97316' : pt.fatigueScore >= 25 ? '#F59E0B' : '#10B981';

                return (
                  <g key={pt.id} className="cursor-pointer" onMouseEnter={() => setHoveredPoint(pt)} onMouseLeave={() => setHoveredPoint(null)}>
                    <line
                      x1={pt.x}
                      y1={padding.top}
                      x2={pt.x}
                      y2={padding.top + graphH}
                      stroke={isHovered ? "rgba(0, 240, 255, 0.4)" : "rgba(30, 50, 100, 0.3)"}
                      strokeDasharray="2 2"
                      strokeWidth={isHovered ? "1.5" : "1"}
                    />
                    <line
                      x1={pt.x}
                      y1={padding.top + graphH}
                      x2={pt.x}
                      y2={padding.top + graphH + 6}
                      stroke="#00F0FF"
                      strokeWidth="1.5"
                    />
                    <text
                      x={pt.x}
                      y={padding.top + graphH + 20}
                      textAnchor="middle"
                      fill="#E2E8F0"
                      fontSize="10"
                      fontWeight="bold"
                    >
                      {pt.recordDate.slice(5)}
                    </text>
                    <text
                      x={pt.x}
                      y={padding.top + graphH + 34}
                      textAnchor="middle"
                      fill="#94A3B8"
                      fontSize="9"
                    >
                      {pt.recordTime || '00:00'}
                    </text>

                    {isHovered && (
                      <circle
                        cx={pt.x}
                        cy={pt.y}
                        r="12"
                        fill="none"
                        stroke={dotColor}
                        strokeWidth="2"
                        opacity="0.6"
                      />
                    )}

                    <circle
                      cx={pt.x}
                      cy={pt.y}
                      r={isHovered ? "7" : "5"}
                      fill={dotColor}
                      stroke="#030712"
                      strokeWidth="2"
                    />

                    <text
                      x={pt.x}
                      y={pt.y - 10}
                      textAnchor="middle"
                      fill={dotColor}
                      fontSize="10"
                      fontWeight="800"
                    >
                      {pt.fatigueScore}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          {hoveredPoint && (
            <div className="p-4 rounded-xl bg-[#081024] border border-cyan-500/50 shadow-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-xs font-mono">
              <div className="space-y-1">
                <div className="text-slate-400 text-[11px]">
                  Recorded Date &amp; Time: <strong className="text-slate-100">{hoveredPoint.recordDate} at {hoveredPoint.recordTime}</strong>
                </div>
                <div className="text-slate-300 font-sans">
                  Duty: <strong>{hoveredPoint.dutyDuration}h ({hoveredPoint.dutyStartTime} - {hoveredPoint.dutyEndTime})</strong> • Shift: <strong className="uppercase">{hoveredPoint.shiftType === 'night' ? 'Night Duty' : 'Day Shift'}</strong> • Sleep: <strong>{hoveredPoint.sleepHours} hrs</strong> • Work Intensity: <strong className="uppercase text-amber-300">{hoveredPoint.workload}</strong>
                </div>
                {hoveredPoint.notes && (
                  <div className="text-slate-400 italic text-[11px]">"{hoveredPoint.notes}"</div>
                )}
              </div>

              <div className="flex items-center gap-3 shrink-0">
                <div className="text-right">
                  <div className="text-2xl font-black" style={{ color: hoveredPoint.fatigueScore >= 75 ? '#F43F5E' : hoveredPoint.fatigueScore >= 50 ? '#F97316' : hoveredPoint.fatigueScore >= 25 ? '#F59E0B' : '#10B981' }}>
                    {hoveredPoint.fatigueScore} <span className="text-xs font-normal text-slate-400">/ 100</span>
                  </div>
                  <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-bold ${
                    hoveredPoint.riskCategory === 'CRITICAL RISK' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' :
                    hoveredPoint.riskCategory === 'HIGH RISK' ? 'bg-orange-500/20 text-orange-300 border border-orange-500/30' :
                    hoveredPoint.riskCategory === 'MODERATE RISK' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                    'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                  }`}>
                    {hoveredPoint.riskCategory}
                  </span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function CrewFatigueApp() {
      const [currentView, setCurrentView] = useState('home'); // 'home', 'app', 'admin'

      // Persistent Local State with Instant Fallback
      const [personnelList, setPersonnelList] = useState(() => {
        try {
          const saved = localStorage.getItem("aerofatigue_personnel_list_v5");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_PERSONNEL;
      });

      const [fatigueLogs, setFatigueLogs] = useState(() => {
        try {
          const saved = localStorage.getItem("aerofatigue_history_logs_v5");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_LOGS;
      });

      // Admin Credentials & Authentication State
      const [adminCreds, setAdminCreds] = useState(() => {
        try {
          const saved = localStorage.getItem("aerofatigue_admin_creds_v5");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.id && parsed.password) return parsed;
          }
        } catch (e) {}
        return { id: DEFAULT_ADMIN_ID, password: DEFAULT_ADMIN_PASS };
      });

      // Live local caching for instant loading across reloads / offline
      useEffect(() => {
        try {
          localStorage.setItem("aerofatigue_personnel_list_v5", JSON.stringify(personnelList));
        } catch (e) {}
      }, [personnelList]);

      useEffect(() => {
        try {
          localStorage.setItem("aerofatigue_history_logs_v5", JSON.stringify(fatigueLogs));
        } catch (e) {}
      }, [fatigueLogs]);

      useEffect(() => {
        try {
          localStorage.setItem("aerofatigue_admin_creds_v5", JSON.stringify(adminCreds));
        } catch (e) {}
      }, [adminCreds]);

      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

      const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
      const [adminInputId, setAdminInputId] = useState('');
      const [adminInputPass, setAdminInputPass] = useState('');
      const [adminLoginError, setAdminLoginError] = useState('');

      // Operational Portal Search Query (Air Crew & Ground Crew)
      const [portalSearchQuery, setPortalSearchQuery] = useState('');

      // Secure Dashboard Login Modal for Individual Crew Member
      const [showPersonPasswordModal, setShowPersonPasswordModal] = useState(false);
      const [verifyingPerson, setVerifyingPerson] = useState(null);
      const [personPasswordInput, setPersonPasswordInput] = useState('');
      const [personPasswordError, setPersonPasswordError] = useState('');

      // Admin Console Sub-Tabs
      const [adminTab, setAdminTab] = useState('fleet_overview'); // 'fleet_overview', 'master_logs', 'personnel', 'security'
      const [adminSectionFilter, setAdminSectionFilter] = useState('all'); // 'all', 'aircrew', 'ground_crew'
      const [adminSearchQuery, setAdminSearchQuery] = useState('');
      const [adminRiskFilter, setAdminRiskFilter] = useState('all');

      // Admin Change Password Modal
      const [showChangePasswordModal, setShowChangePasswordModal] = useState(false);
      const [currPasswordInput, setCurrPasswordInput] = useState('');
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [confirmPasswordInput, setConfirmPasswordInput] = useState('');
      const [changePassError, setChangePassError] = useState('');

      const [activeSection, setActiveSection] = useState('aircrew');
      const [selectedPersonId, setSelectedPersonId] = useState(null);

      const [dashboardTab, setDashboardTab] = useState('overview');

      // Modal: Add Person
      const [showAddPersonModal, setShowAddPersonModal] = useState(false);
      const [addSection, setAddSection] = useState('aircrew');
      const [newPersonName, setNewPersonName] = useState('');
      const [newPersonRole, setNewPersonRole] = useState('');
      const [newPersonUnit, setNewPersonUnit] = useState('');
      const [newPersonPhoto, setNewPersonPhoto] = useState(null);
      const [newPersonPassword, setNewPersonPassword] = useState('');

      // Modal: Edit Person
      const [showEditPersonModal, setShowEditPersonModal] = useState(false);
      const [editingPersonId, setEditingPersonId] = useState(null);
      const [editPersonName, setEditPersonName] = useState('');
      const [editPersonRole, setEditPersonRole] = useState('');
      const [editPersonSection, setEditPersonSection] = useState('aircrew');
      const [editPersonUnit, setEditPersonUnit] = useState('');
      const [editPersonPhoto, setEditPersonPhoto] = useState(null);
      const [editPersonPassword, setEditPersonPassword] = useState('');

      // Modal: Delete Person Confirmation
      const [showDeleteModal, setShowDeleteModal] = useState(false);
      const [deletingPerson, setDeletingPerson] = useState(null);

      // Modal: Edit Existing Fatigue Entry (Update Entry)
      const [showEditEntryModal, setShowEditEntryModal] = useState(false);
      const [editingEntryId, setEditingEntryId] = useState(null);
      const [editEntryDate, setEditEntryDate] = useState('');
      const [editEntryTime, setEditEntryTime] = useState('');
      const [editDutyStartTime, setEditDutyStartTime] = useState('08:00');
      const [editDutyEndTime, setEditDutyEndTime] = useState('16:30');
      const [editShiftType, setEditShiftType] = useState('day');
      const [editConsecutiveDays, setEditConsecutiveDays] = useState(1);
      const [editWorkload, setEditWorkload] = useState('medium');
      const [editSleepHours, setEditSleepHours] = useState(7.0);
      const [editEntryNotes, setEditEntryNotes] = useState('');

      // Modal: Delete Fatigue Entry Confirmation
      const [showDeleteEntryModal, setShowDeleteEntryModal] = useState(false);
      const [deletingEntry, setDeletingEntry] = useState(null);

      // Notification Toast
      const [systemNotice, setSystemNotice] = useState(null);

      // New Entry Form Inputs (Synchronized with System Current Time & Auto Consecutive Days)
      const [entryDate, setEntryDate] = useState(getSystemCurrentDate);
      const [entryTime, setEntryTime] = useState(getSystemCurrentTime);
      const [dutyStartTime, setDutyStartTime] = useState('08:00');
      const [dutyEndTime, setDutyEndTime] = useState('16:30');
      const [shiftType, setShiftType] = useState('day');
      const [consecutiveDays, setConsecutiveDays] = useState(1);
      const [workload, setWorkload] = useState('medium');
      const [sleepHours, setSleepHours] = useState(7.0);
      const [entryNotes, setEntryNotes] = useState('');
      const [saveNotice, setSaveNotice] = useState(false);

      // Google Firebase Cloud State & Firestore Manager
      const [cloudConfig, setCloudConfig] = useState(getStoredFirebaseConfig);
      const [cloudStatus, setCloudStatus] = useState('unconfigured'); // 'unconfigured', 'connecting', 'connected', 'error'
      const [cloudError, setCloudError] = useState('');
      const [showCloudModal, setShowCloudModal] = useState(false);
      const [cloudInputCode, setCloudInputCode] = useState('');
      const [isSyncingCloud, setIsSyncingCloud] = useState(false);
      const [firestoreDb, setFirestoreDb] = useState(null);

      // Firebase Authentication State (Email/Password & Google Sign-In)
      const [authUser, setAuthUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('signin'); // 'signin', 'signup'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authDisplayName, setAuthDisplayName] = useState('');
      const [authRoleSection, setAuthRoleSection] = useState('aircrew');
      const [authRoleTitle, setAuthRoleTitle] = useState('');
      const [authUnit, setAuthUnit] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');
      const [showReferMenu, setShowReferMenu] = useState(false);
      const [showUserManualModal, setShowUserManualModal] = useState(false);
      const [manualTab, setManualTab] = useState('getting_started');

      // Real-time Firebase Cloud Firestore & Authentication Engine
      useEffect(() => {
        if (!cloudConfig || !cloudConfig.projectId || !cloudConfig.apiKey) {
          setCloudStatus('unconfigured');
          setFirestoreDb(null);
          return;
        }

        if (typeof firebase === 'undefined') {
          setCloudStatus('error');
          setCloudError('Firebase SDK CDN could not be loaded. Please ensure internet access.');
          return;
        }

        let dbInstance = null;
        let unsubPersonnel = null;
        let unsubLogs = null;
        let unsubAdmin = null;
        let unsubAuth = null;

        try {
          setCloudStatus('connecting');
          setCloudError('');

          let app;
          if (!firebase.apps || firebase.apps.length === 0) {
            app = firebase.initializeApp(cloudConfig);
          } else {
            app = firebase.app();
          }

          dbInstance = firebase.firestore(app);
          setFirestoreDb(dbInstance);

          // 1. Live Sync: Personnel Collection
          unsubPersonnel = dbInstance.collection('aerofatigue_personnel').onSnapshot(
            (snapshot) => {
              if (!snapshot.empty) {
                const list = [];
                snapshot.forEach(doc => {
                  list.push({ id: doc.id, ...doc.data() });
                });
                setPersonnelList(list);
              } else {
                // Auto-seed cloud if database collection is empty
                const batch = dbInstance.batch();
                personnelList.forEach(p => {
                  batch.set(dbInstance.collection('aerofatigue_personnel').doc(p.id), p);
                });
                batch.commit().catch(e => console.error("Initial auto-seed personnel error:", e));
              }
              setCloudStatus('connected');
            },
            (err) => {
              console.error('Firestore personnel listener error:', err);
              setCloudStatus('error');
              setCloudError(err.message || 'Firestore connection error');
            }
          );

          // 2. Live Sync: Fatigue Logs Collection
          unsubLogs = dbInstance.collection('aerofatigue_logs').onSnapshot(
            (snapshot) => {
              if (!snapshot.empty) {
                const logs = [];
                snapshot.forEach(doc => {
                  logs.push({ id: doc.id, ...doc.data() });
                });
                logs.sort((a, b) => new Date(`${b.recordDate}T${b.recordTime || '00:00'}`) - new Date(`${a.recordDate}T${a.recordTime || '00:00'}`));
                setFatigueLogs(logs);
              } else {
                // Auto-seed cloud logs if database collection is empty
                const batch = dbInstance.batch();
                fatigueLogs.forEach(l => {
                  batch.set(dbInstance.collection('aerofatigue_logs').doc(l.id), l);
                });
                batch.commit().catch(e => console.error("Initial auto-seed logs error:", e));
              }
            },
            (err) => {
              console.error('Firestore logs listener error:', err);
            }
          );

          // 3. Live Sync: Admin Credentials
          unsubAdmin = dbInstance.collection('aerofatigue_config').doc('admin').onSnapshot(
            (doc) => {
              if (doc.exists) {
                const data = doc.data();
                if (data && data.password) {
                  setAdminCreds({ id: data.id || DEFAULT_ADMIN_ID, password: data.password });
                }
              } else {
                dbInstance.collection('aerofatigue_config').doc('admin').set({
                  id: adminCreds.id || DEFAULT_ADMIN_ID,
                  password: adminCreds.password || DEFAULT_ADMIN_PASS,
                  updatedAt: new Date().toISOString()
                }).catch(e => console.error("Initial auto-seed admin error:", e));
              }
            },
            (err) => {
              console.error('Firestore admin listener error:', err);
            }
          );

          // 4. Live Sync: Firebase Authentication State
          if (firebase.auth) {
            unsubAuth = firebase.auth(app).onAuthStateChanged((user) => {
              setAuthUser(user || null);
            });
          }

        } catch (err) {
          console.error('Firebase initialization error:', err);
          setCloudStatus('error');
          setCloudError(err.message || 'Failed to initialize Firebase');
        }

        return () => {
          if (unsubPersonnel) unsubPersonnel();
          if (unsubLogs) unsubLogs();
          if (unsubAdmin) unsubAdmin();
          if (unsubAuth) unsubAuth();
        };
      }, [cloudConfig]);

      const activePerson = useMemo(() => {
        if (!selectedPersonId) return null;
        return personnelList.find(p => p.id === selectedPersonId) || null;
      }, [selectedPersonId, personnelList]);

      const sectionPersonnel = useMemo(() => {
        return personnelList.filter(p => p.section === activeSection);
      }, [personnelList, activeSection]);

      const filteredPortalPersonnel = useMemo(() => {
        if (!portalSearchQuery.trim()) return null;
        const q = portalSearchQuery.toLowerCase().trim();
        return personnelList.filter(p => {
          const matchName = (p.name || '').toLowerCase().includes(q);
          const matchId = (p.id || '').toLowerCase().includes(q);
          const matchRole = (p.roleTitle || '').toLowerCase().includes(q);
          const matchUnit = (p.unit || '').toLowerCase().includes(q);
          return matchName || matchId || matchRole || matchUnit;
        });
      }, [personnelList, portalSearchQuery]);

      const activePersonLogs = useMemo(() => {
        if (!selectedPersonId) return [];
        return fatigueLogs
          .filter(l => l.personnelId === selectedPersonId)
          .sort((a, b) => {
            const timeA = new Date(`${a.recordDate}T${a.recordTime || '00:00'}`).getTime();
            const timeB = new Date(`${b.recordDate}T${b.recordTime || '00:00'}`).getTime();
            return timeB - timeA;
          });
      }, [selectedPersonId, fatigueLogs]);

      const latestLog = useMemo(() => {
        return activePersonLogs.length > 0 ? activePersonLogs[0] : null;
      }, [activePersonLogs]);

      const activeStats = useMemo(() => {
        if (activePersonLogs.length === 0) {
          return { avgSleep: 0, avgDuty: 0, latestScore: 0, latestCategory: 'NO DATA', totalLogs: 0 };
        }
        const totalSleep = activePersonLogs.reduce((acc, l) => acc + (Number(l.sleepHours) || 0), 0);
        const totalDuty = activePersonLogs.reduce((acc, l) => acc + (Number(l.dutyDuration) || 0), 0);
        return {
          avgSleep: Math.round((totalSleep / activePersonLogs.length) * 10) / 10,
          avgDuty: Math.round((totalDuty / activePersonLogs.length) * 10) / 10,
          latestScore: activePersonLogs[0].fatigueScore,
          latestCategory: activePersonLogs[0].riskCategory,
          totalLogs: activePersonLogs.length
        };
      }, [activePersonLogs]);

      // Overall Fleet Metrics for Admin
      const fleetMetrics = useMemo(() => {
        const totalPersonnel = personnelList.length;
        const totalAircrew = personnelList.filter(p => p.section === 'aircrew').length;
        const totalGround = personnelList.filter(p => p.section === 'ground_crew').length;
        const totalLogs = fatigueLogs.length;

        const criticalCount = fatigueLogs.filter(l => l.riskCategory === 'CRITICAL RISK').length;
        const highCount = fatigueLogs.filter(l => l.riskCategory === 'HIGH RISK').length;

        const totalSleep = fatigueLogs.reduce((acc, l) => acc + (Number(l.sleepHours) || 0), 0);
        const totalDuty = fatigueLogs.reduce((acc, l) => acc + (Number(l.dutyDuration) || 0), 0);

        return {
          totalPersonnel,
          totalAircrew,
          totalGround,
          totalLogs,
          criticalCount,
          highCount,
          avgFleetSleep: totalLogs > 0 ? (totalSleep / totalLogs).toFixed(1) : '0',
          avgFleetDuty: totalLogs > 0 ? (totalDuty / totalLogs).toFixed(1) : '0',
        };
      }, [personnelList, fatigueLogs]);

      // Admin Filtered Master Logs
      const filteredMasterLogs = useMemo(() => {
        return fatigueLogs
          .map(log => {
            const person = personnelList.find(p => p.id === log.personnelId);
            return { ...log, person };
          })
          .filter(item => {
            if (!item.person) return false;
            // Section filter
            if (adminSectionFilter !== 'all' && item.person.section !== adminSectionFilter) return false;
            // Risk filter
            if (adminRiskFilter !== 'all' && item.riskCategory !== adminRiskFilter) return false;
            // Search query (name, id, unit, notes)
            if (adminSearchQuery.trim()) {
              const q = adminSearchQuery.toLowerCase();
              const matchName = item.person.name.toLowerCase().includes(q);
              const matchId = item.person.id.toLowerCase().includes(q);
              const matchUnit = (item.person.unit || '').toLowerCase().includes(q);
              const matchNotes = (item.notes || '').toLowerCase().includes(q);
              if (!matchName && !matchId && !matchUnit && !matchNotes) return false;
            }
            return true;
          })
          .sort((a, b) => {
            const timeA = new Date(`${a.recordDate}T${a.recordTime || '00:00'}`).getTime();
            const timeB = new Date(`${b.recordDate}T${b.recordTime || '00:00'}`).getTime();
            return timeB - timeA;
          });
      }, [fatigueLogs, personnelList, adminSectionFilter, adminRiskFilter, adminSearchQuery]);

      // Auto-refresh timestamp and consecutive days when opening check-in tab
      useEffect(() => {
        if (dashboardTab === 'checkin' && activePerson) {
          const sysTime = getSystemCurrentTime();
          setEntryTime(sysTime);
          const autoDays = calculateAutoConsecutiveDays(activePersonLogs, entryDate);
          setConsecutiveDays(autoDays);
        }
      }, [dashboardTab, selectedPersonId, entryDate]);

      const triggerNotice = (msg, type = "success") => {
        setSystemNotice({ msg, type });
        setTimeout(() => setSystemNotice(null), 3500);
      };

      // Navigation & Dashboard Handlers
      const handleEnterAeroFatigue = () => setCurrentView('app');
      const handleReturnToHome = () => setCurrentView('home');
      const handleOpenDashboardDirect = (personId) => {
        setSelectedPersonId(personId);
        setDashboardTab('overview');
      };
      const handleBackToSections = () => setSelectedPersonId(null);

      // --- SECURE CREW DASHBOARD LOGIN ---
      const handlePromptPersonLogin = (person, e) => {
        if (e) e.stopPropagation();
        if (currentView === 'admin' && isAdminLoggedIn) {
          // Admin has master access privileges
          handleOpenDashboardDirect(person.id);
          return;
        }
        setVerifyingPerson(person);
        setPersonPasswordInput('');
        setPersonPasswordError('');
        setShowPersonPasswordModal(true);
      };

      const handlePersonPasswordSubmit = (e) => {
        e.preventDefault();
        if (!verifyingPerson) return;
        const expected = verifyingPerson.password || '123456';
        if (personPasswordInput === expected) {
          setShowPersonPasswordModal(false);
          setSelectedPersonId(verifyingPerson.id);
          setDashboardTab('overview');
          triggerNotice(`Authenticated as ${verifyingPerson.name} (${verifyingPerson.id}). Dashboard unlocked!`);
        } else {
          setPersonPasswordError(`Incorrect password for ${verifyingPerson.name}. Please try again.`);
        }
      };

      // --- ADMIN LOGIN / AUTHENTICATION ---
      const handleOpenAdminLogin = () => {
        if (isAdminLoggedIn) {
          setCurrentView('admin');
        } else {
          setAdminInputId(DEFAULT_ADMIN_ID);
          setAdminInputPass('');
          setAdminLoginError('');
          setShowAdminLoginModal(true);
        }
      };

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        const inputIdClean = adminInputId.trim().toUpperCase();
        const storedIdClean = adminCreds.id.toUpperCase();

        if (inputIdClean === storedIdClean && adminInputPass === adminCreds.password) {
          setIsAdminLoggedIn(true);
          sessionStorage.setItem("aerofatigue_admin_logged_in", "true");
          setShowAdminLoginModal(false);
          setCurrentView('admin');
          setAdminTab('fleet_overview');
          triggerNotice(`Welcome, Admin (${adminCreds.id})! Full Fleet Access Granted.`);
        } else {
          setAdminLoginError("Invalid Admin ID or Password. (Default: ID INAS336 / Pass 123456)");
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        sessionStorage.removeItem("aerofatigue_admin_logged_in");
        setCurrentView('app');
        triggerNotice("Admin session logged out safely.", "danger");
      };

      // --- CLOUD FIRESTORE HELPERS & ACTIONS ---
      const handleSeedDataToCloud = async () => {
        if (!firestoreDb) {
          triggerNotice("Firebase is not connected. Please enter valid Firebase config first.", "danger");
          return;
        }
        setIsSyncingCloud(true);
        try {
          const batch = firestoreDb.batch();

          // Upload all personnel
          personnelList.forEach(p => {
            const ref = firestoreDb.collection('aerofatigue_personnel').doc(p.id);
            batch.set(ref, p, { merge: true });
          });

          // Upload all fatigue logs
          fatigueLogs.forEach(l => {
            const ref = firestoreDb.collection('aerofatigue_logs').doc(l.id);
            batch.set(ref, l, { merge: true });
          });

          // Upload Admin Settings
          const adminRef = firestoreDb.collection('aerofatigue_config').doc('admin');
          batch.set(adminRef, { id: adminCreds.id, password: adminCreds.password, updatedAt: new Date().toISOString() }, { merge: true });

          await batch.commit();
          setIsSyncingCloud(false);
          triggerNotice(`☁️ Successfully uploaded ${personnelList.length} crew profiles & ${fatigueLogs.length} logs to Firebase!`);
        } catch (err) {
          setIsSyncingCloud(false);
          console.error("Cloud seed error:", err);
          triggerNotice(`Cloud upload failed: ${err.message}`, "danger");
        }
      };

      const handleSaveCloudConfig = (e) => {
        e.preventDefault();
        const parsed = parseFirebaseConfigInput(cloudInputCode);
        if (!parsed || !parsed.apiKey || !parsed.projectId) {
          setCloudError("Invalid Firebase configuration snippet. Ensure 'apiKey' and 'projectId' are provided.");
          return;
        }

        try {
          localStorage.setItem("aerofatigue_firebase_config_v1", JSON.stringify(parsed));
          setCloudConfig(parsed);
          setShowCloudModal(false);
          triggerNotice(`Connecting to Firebase Project "${parsed.projectId}"...`);
        } catch (err) {
          setCloudError("Failed to save config: " + err.message);
        }
      };

      const handleDisconnectCloud = () => {
        try {
          localStorage.removeItem("aerofatigue_firebase_config_v1");
          setCloudConfig(null);
          setCloudStatus('unconfigured');
          setFirestoreDb(null);
          setShowCloudModal(false);
          triggerNotice("Disconnected from Firebase. Operating in Local In-Memory Mode.", "danger");
        } catch (err) {}
      };

      const handleCopyShareLink = async () => {
        if (!cloudConfig || !cloudConfig.apiKey || !cloudConfig.projectId) {
          triggerNotice("Please connect a Firebase project first to generate a live sync link.", "danger");
          return;
        }
        const link = generateShareableSyncLink(cloudConfig);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(link);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = link;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
          }
          triggerNotice("🔗 Live Sync Link copied! Anyone opening this link on another device will automatically connect to this server.");
        } catch (err) {
          triggerNotice("Could not auto-copy link. Please select and copy the text box manually.", "danger");
        }
      };

      // --- FIREBASE AUTHENTICATION HANDLERS ---
      const handleGoogleSignIn = async () => {
        if (!firebase.apps || firebase.apps.length === 0 || !cloudConfig || !cloudConfig.apiKey) {
          setAuthError("Firebase is not connected yet. Please click 'Configure Firebase Keys Now' below to paste your Firebase config snippet.");
          return;
        }
        if (!firebase.auth) {
          setAuthError("Firebase Auth SDK is not available.");
          return;
        }
        setAuthLoading(true);
        setAuthError('');
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          const result = await firebase.auth().signInWithPopup(provider);
          const user = result.user;
          setShowAuthModal(false);
          setAuthLoading(false);
          triggerNotice(`Authenticated with Google as ${user.displayName || user.email}!`);
        } catch (err) {
          setAuthLoading(false);
          console.error("Google Auth error:", err);
          setAuthError(err.message || "Google Sign-In failed. Ensure Google provider is enabled in Firebase Console.");
        }
      };

      const handleEmailSignIn = async (e) => {
        e.preventDefault();
        if (!firebase.apps || firebase.apps.length === 0 || !cloudConfig || !cloudConfig.apiKey) {
          setAuthError("Firebase is not connected yet. Please click 'Configure Firebase Keys Now' below to paste your Firebase config snippet.");
          return;
        }
        if (!authEmail.trim() || !authPassword.trim()) {
          setAuthError("Please enter your email and password.");
          return;
        }
        setAuthLoading(true);
        setAuthError('');
        try {
          const result = await firebase.auth().signInWithEmailAndPassword(authEmail.trim(), authPassword);
          setShowAuthModal(false);
          setAuthLoading(false);
          triggerNotice(`Signed in successfully as ${result.user.email}!`);
        } catch (err) {
          setAuthLoading(false);
          console.error("Email sign-in error:", err);
          setAuthError(err.message || "Invalid email or password.");
        }
      };

      const handleEmailSignUp = async (e) => {
        e.preventDefault();
        if (!firebase.apps || firebase.apps.length === 0 || !cloudConfig || !cloudConfig.apiKey) {
          setAuthError("Firebase is not connected yet. Please click 'Configure Firebase Keys Now' below to paste your Firebase config snippet.");
          return;
        }
        if (!authEmail.trim() || !authPassword.trim()) {
          setAuthError("Email and password are required.");
          return;
        }
        if (authPassword.length < 6) {
          setAuthError("Password must be at least 6 characters long.");
          return;
        }
        setAuthLoading(true);
        setAuthError('');
        try {
          const result = await firebase.auth().createUserWithEmailAndPassword(authEmail.trim(), authPassword);
          const user = result.user;

          if (authDisplayName.trim()) {
            await user.updateProfile({ displayName: authDisplayName.trim() });
          }

          // Automatically provision a crew member record linked to this user
          const count = personnelList.filter(p => p.section === authRoleSection).length + 1;
          const prefix = authRoleSection === 'aircrew' ? 'AC' : 'MX';
          const newId = `${prefix}-${String(count).padStart(3, '0')}`;
          const newCrewPerson = {
            id: newId,
            name: authDisplayName.trim() || user.email.split('@')[0],
            section: authRoleSection,
            roleTitle: authRoleTitle.trim() || (authRoleSection === 'aircrew' ? 'Flight Crew Member' : 'Maintenance Specialist'),
            unit: authUnit.trim() || 'Naval Aviation Operational Unit',
            photoUrl: null,
            password: '123456',
            email: user.email,
            uid: user.uid,
            createdAt: getSystemCurrentDate()
          };

          setPersonnelList(prev => [...prev, newCrewPerson]);
          if (firestoreDb && cloudStatus === 'connected') {
            await firestoreDb.collection('aerofatigue_personnel').doc(newId).set(newCrewPerson);
          }

          setShowAuthModal(false);
          setAuthLoading(false);
          triggerNotice(`Account created! Welcome, ${newCrewPerson.name} (${newCrewPerson.id}).`);
        } catch (err) {
          setAuthLoading(false);
          console.error("Sign-up error:", err);
          setAuthError(err.message || "Failed to create account. Ensure Email/Password provider is enabled in Firebase Console.");
        }
      };

      const handleSignOut = async () => {
        try {
          if (firebase.apps && firebase.apps.length > 0 && firebase.auth) {
            await firebase.auth().signOut();
          }
          setAuthUser(null);
          triggerNotice("Signed out of Firebase account.", "danger");
        } catch (err) {
          console.error("Sign out error:", err);
        }
      };

      // --- ADMIN CHANGE PASSWORD ---
      const handleOpenChangePasswordModal = () => {
        setCurrPasswordInput('');
        setNewPasswordInput('');
        setConfirmPasswordInput('');
        setChangePassError('');
        setShowChangePasswordModal(true);
      };

      const handleChangePasswordSubmit = (e) => {
        e.preventDefault();
        if (currPasswordInput !== adminCreds.password) {
          setChangePassError("Current password is incorrect.");
          return;
        }
        if (!newPasswordInput || newPasswordInput.length < 4) {
          setChangePassError("New password must be at least 4 characters.");
          return;
        }
        if (newPasswordInput !== confirmPasswordInput) {
          setChangePassError("New password and confirm password do not match.");
          return;
        }

        const updatedCreds = { ...adminCreds, password: newPasswordInput };
        setAdminCreds(updatedCreds);

        // Sync to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_config').doc('admin').set({
            id: adminCreds.id,
            password: newPasswordInput,
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch(err => {
            console.error('Error updating admin password in Firestore:', err);
          });
        }

        setShowChangePasswordModal(false);
        triggerNotice(`Password for Admin ID "${adminCreds.id}" updated successfully!`);
      };

      // --- ADD PERSON ---
      const handleOpenAddModal = (section) => {
        setAddSection(section);
        setNewPersonName('');
        setNewPersonRole(section === 'aircrew' ? 'Captain / Pilot' : 'Maintenance Specialist');
        setNewPersonUnit(section === 'aircrew' ? 'Naval Aviation Squadron' : 'Hangar Maintenance');
        setNewPersonPhoto(null);
        setNewPersonPassword('');
        setShowAddPersonModal(true);
      };

      const handleAddPhotoUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const dataUrl = await fileToDataUrl(file);
            setNewPersonPhoto(dataUrl);
          } catch (err) {
            triggerNotice("Error reading image file.", "danger");
          }
        }
      };

      const handleSavePerson = (e) => {
        e.preventDefault();
        if (!newPersonName.trim()) return;
        if (!newPersonPassword.trim()) {
          triggerNotice("Password is required for adding a crew member.", "danger");
          return;
        }

        const count = personnelList.filter(p => p.section === addSection).length + 1;
        const prefix = addSection === 'aircrew' ? 'AC' : 'MX';
        const newId = `${prefix}-${String(count).padStart(3, '0')}`;

        const newP = {
          id: newId,
          name: newPersonName.trim(),
          section: addSection,
          roleTitle: newPersonRole.trim() || (addSection === 'aircrew' ? 'Flight Crew' : 'Ground Engineer'),
          unit: newPersonUnit.trim() || 'General Operations',
          photoUrl: newPersonPhoto,
          password: newPersonPassword.trim(),
          createdAt: getSystemCurrentDate()
        };

        setPersonnelList(prev => [...prev, newP]);

        // Sync to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_personnel').doc(newP.id).set(newP).catch(err => {
            console.error('Error saving person to Firestore:', err);
          });
        }

        setShowAddPersonModal(false);
        triggerNotice(`Added "${newP.name}" (${newP.id}) successfully! Password set.`);
        if (currentView !== 'admin') {
          handleOpenDashboardDirect(newP.id);
        }
      };

      // --- EDIT PERSON ---
      const handleOpenEditModal = (person, e) => {
        if (e) e.stopPropagation();
        setEditingPersonId(person.id);
        setEditPersonName(person.name);
        setEditPersonRole(person.roleTitle);
        setEditPersonSection(person.section);
        setEditPersonUnit(person.unit);
        setEditPersonPhoto(person.photoUrl || null);
        setEditPersonPassword(person.password || '123456');
        setShowEditPersonModal(true);
      };

      const handleEditPhotoUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const dataUrl = await fileToDataUrl(file);
            setEditPersonPhoto(dataUrl);
          } catch (err) {
            triggerNotice("Error reading image file.", "danger");
          }
        }
      };

      const handleSaveEditedPerson = (e) => {
        e.preventDefault();
        if (!editPersonName.trim() || !editingPersonId) return;

        const updatedPerson = {
          name: editPersonName.trim(),
          roleTitle: editPersonRole.trim(),
          section: editPersonSection,
          unit: editPersonUnit.trim(),
          photoUrl: editPersonPhoto,
          password: editPersonPassword.trim() || '123456'
        };

        setPersonnelList(prev => prev.map(p => {
          if (p.id === editingPersonId) {
            return { ...p, ...updatedPerson };
          }
          return p;
        }));

        // Sync to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_personnel').doc(editingPersonId).set(updatedPerson, { merge: true }).catch(err => {
            console.error('Error updating person in Firestore:', err);
          });
        }

        setShowEditPersonModal(false);
        triggerNotice(`Updated profile & credentials for "${editPersonName.trim()}"!`);
      };

      // --- DELETE PERSON ---
      const handleOpenDeleteModal = (person, e) => {
        if (e) e.stopPropagation();
        setDeletingPerson(person);
        setShowDeleteModal(true);
      };

      const handleConfirmDelete = () => {
        if (!deletingPerson) return;
        const deletedId = deletingPerson.id;
        const deletedName = deletingPerson.name;

        setPersonnelList(prev => prev.filter(p => p.id !== deletedId));
        setFatigueLogs(prev => prev.filter(l => l.personnelId !== deletedId));

        // Sync deletion to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_personnel').doc(deletedId).delete().catch(err => {
            console.error('Error deleting person from Firestore:', err);
          });
          firestoreDb.collection('aerofatigue_logs').where('personnelId', '==', deletedId).get().then(snap => {
            const batch = firestoreDb.batch();
            snap.forEach(doc => batch.delete(doc.ref));
            batch.commit();
          }).catch(err => console.error('Error deleting logs for person:', err));
        }

        if (selectedPersonId === deletedId) {
          setSelectedPersonId(null);
        }

        setShowDeleteModal(false);
        setDeletingPerson(null);
        triggerNotice(`Deleted personnel "${deletedName}" (${deletedId}) and associated records.`, "danger");
      };

      // --- RECORD NEW FATIGUE ENTRY ---
      const handleSaveFatigueEntry = (e) => {
        e.preventDefault();
        if (!activePerson) return;

        const dutyDuration = calculateDutyDuration(dutyStartTime, dutyEndTime);
        const inputs = {
          sleepHours,
          dutyDuration,
          shiftType,
          consecutiveDays,
          workload
        };

        const calc = calculateFatigueScore(inputs);

        const newLog = {
          id: `LOG-${activePerson.id}-${Date.now()}`,
          personnelId: activePerson.id,
          recordDate: entryDate,
          recordTime: entryTime,
          dateTimeISO: `${entryDate}T${entryTime}`,
          dutyStartTime,
          dutyEndTime,
          dutyDuration,
          shiftType,
          consecutiveDays: Number(consecutiveDays),
          workload,
          sleepHours: Number(sleepHours),
          fatigueScore: calc.score,
          riskCategory: calc.category,
          notes: entryNotes.trim()
        };

        setFatigueLogs(prev => [newLog, ...prev]);

        // Sync to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_logs').doc(newLog.id).set(newLog).catch(err => {
            console.error('Error saving log to Firestore:', err);
          });
        }

        setSaveNotice(true);
        setTimeout(() => setSaveNotice(false), 3000);
        triggerNotice(`Fatigue entry recorded for ${activePerson.name}!`);
        setDashboardTab('overview');
      };

      // --- UPDATE / EDIT EXISTING FATIGUE ENTRY ---
      const handleOpenEditEntryModal = (entry, e) => {
        if (e) e.stopPropagation();
        setEditingEntryId(entry.id);
        setEditEntryDate(entry.recordDate);
        setEditEntryTime(entry.recordTime || '08:00');
        setEditDutyStartTime(entry.dutyStartTime || '08:00');
        setEditDutyEndTime(entry.dutyEndTime || '16:30');
        setEditShiftType(entry.shiftType || 'day');
        setEditConsecutiveDays(entry.consecutiveDays || 1);
        setEditWorkload(entry.workload || 'medium');
        setEditSleepHours(entry.sleepHours || 7.0);
        setEditEntryNotes(entry.notes || '');
        setShowEditEntryModal(true);
      };

      const handleSaveEditedEntry = (e) => {
        e.preventDefault();
        if (!editingEntryId) return;

        const dutyDuration = calculateDutyDuration(editDutyStartTime, editDutyEndTime);
        const inputs = {
          sleepHours: editSleepHours,
          dutyDuration,
          shiftType: editShiftType,
          consecutiveDays: editConsecutiveDays,
          workload: editWorkload
        };

        const calc = calculateFatigueScore(inputs);

        const updatedLogFields = {
          recordDate: editEntryDate,
          recordTime: editEntryTime,
          dateTimeISO: `${editEntryDate}T${editEntryTime}`,
          dutyStartTime: editDutyStartTime,
          dutyEndTime: editDutyEndTime,
          dutyDuration,
          shiftType: editShiftType,
          consecutiveDays: Number(editConsecutiveDays),
          workload: editWorkload,
          sleepHours: Number(editSleepHours),
          fatigueScore: calc.score,
          riskCategory: calc.category,
          notes: editEntryNotes.trim()
        };

        setFatigueLogs(prev => prev.map(log => {
          if (log.id === editingEntryId) {
            return { ...log, ...updatedLogFields };
          }
          return log;
        }));

        // Sync to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_logs').doc(editingEntryId).set(updatedLogFields, { merge: true }).catch(err => {
            console.error('Error updating log in Firestore:', err);
          });
        }

        setShowEditEntryModal(false);
        triggerNotice(`Duty and fatigue entry updated successfully!`);
      };

      // --- DELETE FATIGUE ENTRY ---
      const handleOpenDeleteEntryModal = (entry, e) => {
        if (e) e.stopPropagation();
        setDeletingEntry(entry);
        setShowDeleteEntryModal(true);
      };

      const handleConfirmDeleteEntry = () => {
        if (!deletingEntry) return;
        const entryId = deletingEntry.id;
        const entryDate = deletingEntry.recordDate;

        setFatigueLogs(prev => prev.filter(l => l.id !== entryId));

        // Sync deletion to Cloud Firestore if connected
        if (firestoreDb && cloudStatus === 'connected') {
          firestoreDb.collection('aerofatigue_logs').doc(entryId).delete().catch(err => {
            console.error('Error deleting log from Firestore:', err);
          });
        }

        setShowDeleteEntryModal(false);
        setDeletingEntry(null);
        triggerNotice(`Deleted fatigue record for ${entryDate}.`, "danger");
      };

      // --- MODAL RENDERERS ---
      const renderCloudModal = () => {
        if (!showCloudModal) return null;
        return (
          <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
            <div className="glass-panel p-7 max-w-xl w-full space-y-5 bg-[#081024] border-cyan-500/60 shadow-2xl my-8">
              <div className="flex items-center justify-between border-b border-[#1E3264] pb-3.5">
                <h3 className="text-base font-mono font-bold uppercase text-[#00F0FF] flex items-center gap-2">
                  <span>🔥</span>
                  <span>Google Firebase Cloud Sync</span>
                </h3>
                <button onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
              </div>

              {/* Status Card */}
              <div className="p-4 rounded-xl bg-[#030712] border border-[#1E3264] space-y-3 font-mono text-xs">
                <div className="flex items-center justify-between">
                  <span className="text-slate-400">Connection Status:</span>
                  <span className={`px-2.5 py-1 rounded-full font-bold flex items-center gap-1.5 ${
                    cloudStatus === 'connected'
                      ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/50'
                      : cloudStatus === 'connecting'
                      ? 'bg-cyan-950 text-cyan-300 border border-cyan-500/50'
                      : cloudStatus === 'error'
                      ? 'bg-rose-950 text-rose-300 border border-rose-500/50'
                      : 'bg-slate-900 text-amber-300 border border-amber-500/40'
                  }`}>
                    <span className={`w-2 h-2 rounded-full ${
                      cloudStatus === 'connected' ? 'bg-emerald-400 animate-pulse' :
                      cloudStatus === 'connecting' ? 'bg-cyan-400 animate-ping' :
                      cloudStatus === 'error' ? 'bg-rose-400' : 'bg-amber-400'
                    }`}></span>
                    {
                      cloudStatus === 'connected' ? `Connected (Project: ${cloudConfig?.projectId})` :
                      cloudStatus === 'connecting' ? 'Connecting to Firebase...' :
                      cloudStatus === 'error' ? 'Connection Error' : 'Local In-Memory Mode (Offline)'
                    }
                  </span>
                </div>

                {cloudError && (
                  <div className="p-2.5 rounded-lg bg-rose-950/60 border border-rose-500/50 text-rose-200 text-[11px]">
                    ⚠️ {cloudError}
                  </div>
                )}

                <div className="grid grid-cols-3 gap-2 pt-2 border-t border-[#1E3264]/70 text-center text-[11px]">
                  <div className="p-2 rounded-lg bg-[#081024]">
                    <div className="text-slate-400">Personnel</div>
                    <div className="text-sm font-bold text-cyan-300">{personnelList.length} profiles</div>
                  </div>
                  <div className="p-2 rounded-lg bg-[#081024]">
                    <div className="text-slate-400">Fatigue Logs</div>
                    <div className="text-sm font-bold text-amber-300">{fatigueLogs.length} entries</div>
                  </div>
                  <div className="p-2 rounded-lg bg-[#081024]">
                    <div className="text-slate-400">Admin Sync</div>
                    <div className="text-sm font-bold text-purple-300">{adminCreds.id}</div>
                  </div>
                </div>
              </div>

              {/* Multi-Device Live Sharing Link */}
              {cloudStatus === 'connected' && (
                <div className="p-4 rounded-xl bg-[#030712] border border-cyan-500/50 space-y-2.5 font-mono text-xs animate-fadeIn">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-cyan-300 flex items-center gap-1.5">
                      <span>🔗</span> Share Live Server Link (Any Device)
                    </span>
                    <span className="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-full font-bold">
                      ● LIVE AUTO-SYNC ACTIVE
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-300 font-sans leading-tight">

                  </p>
                  <div className="flex items-center gap-2 pt-1">
                    <input
                      type="text"
                      readOnly
                      value={generateShareableSyncLink(cloudConfig)}
                      className="cockpit-input flex-1 font-mono text-[11px] select-all truncate text-cyan-300 bg-[#081024] cursor-pointer"
                      onClick={(e) => e.target.select()}
                    />
                    <button
                      type="button"
                      onClick={handleCopyShareLink}
                      className="btn-cyber text-xs py-2 px-3.5 font-mono font-bold flex items-center gap-1.5 shrink-0"
                      title="Copy Shareable Live Sync Link to Clipboard"
                    >
                      <span>📋</span>
                      <span>Copy Link</span>
                    </button>
                  </div>
                </div>
              )}

              {/* Seed / Upload to Cloud Action */}
              {cloudStatus === 'connected' && (
                <div className="p-4 rounded-xl bg-gradient-to-r from-cyan-950/40 to-blue-950/40 border border-cyan-500/40 space-y-3 font-sans text-xs">
                  <div className="font-bold font-mono text-cyan-300 flex items-center gap-1.5">
                    <span>☁️</span> Cloud Database Operations

                    <button

                      disabled={isSyncingCloud}

                      className="btn-cyber flex-1 py-2.5 text-xs font-mono font-bold flex items-center justify-center gap-2"
                    >
                      {isSyncingCloud ? <span>⏳ Uploading Data...</span> : <span>🚀 Upload Local Data to Firebase</span>}
                    </button>
                    <button
                      type="button"
                      onClick={handleDisconnectCloud}
                      className="btn-glass py-2.5 px-3.5 text-xs text-slate-300 hover:text-rose-300 hover:border-rose-500"
                      title="Clear saved Firebase configuration and return to in-memory local mode"
                    >
                      🔌 Disconnect
                    </button>
                  </div>

              <form onSubmit={handleSaveCloudConfig} className="space-y-4 text-xs font-sans">

                    </label>

                    </a>

                    placeholder={`const firebaseConfig = {\n  apiKey: "AIzaSy...",\n  authDomain: "aerofatigue-portal.firebaseapp.com",\n  projectId: "aerofatigue-portal",\n  storageBucket: "aerofatigue-portal.appspot.com",\n  messagingSenderId: "1234567890",\n  appId: "1:1234567890:web:abcdef"\n};`}
                    value={cloudInputCode}
                    onChange={(e) => setCloudInputCode(e.target.value)}
                    className="cockpit-input w-full font-mono text-xs resize-none"
                  />
                  <span className="text-[11px] text-slate-400 font-mono block mt-1">
                    Tip: You can paste the entire snippet from Project Settings, or paste just your API Key.
                  </span>
                </div>
