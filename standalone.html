                <div className="glass-panel p-7 max-w-lg w-full space-y-5 bg-[#081024] border-amber-500/50 shadow-2xl overflow-y-auto max-h-[90vh]">
                  <div className="flex items-center justify-between border-b border-[#1E3264] pb-3.5">
                    <h3 className="text-base font-mono font-bold uppercase text-amber-400 flex items-center gap-2">
                      <span>✏️</span>
                      <span>Update Fatigue &amp; Duty Entry</span>
                    </h3>
                    <button onClick={() => setShowEditEntryModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                  </div>

                  <form onSubmit={handleSaveEditedEntry} className="space-y-4 text-xs font-sans">
                    <div className="grid grid-cols-2 gap-3 font-mono">
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans">Record Date *</label>
                        <input
                          type="date"
                          required
                          value={editEntryDate}
                          onChange={(e) => setEditEntryDate(e.target.value)}
                          className="cockpit-input w-full font-mono font-bold text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans">Record Time *</label>
                        <input
                          type="time"
                          required
                          value={editEntryTime}
                          onChange={(e) => setEditEntryTime(e.target.value)}
                          className="cockpit-input w-full font-mono font-bold text-xs"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3 font-mono">
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans">Start Time</label>
                        <input
                          type="time"
                          required
                          value={editDutyStartTime}
                          onChange={(e) => setEditDutyStartTime(e.target.value)}
                          className="cockpit-input w-full font-mono text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans">End Time</label>
                        <input
                          type="time"
                          required
                          value={editDutyEndTime}
                          onChange={(e) => setEditDutyEndTime(e.target.value)}
                          className="cockpit-input w-full font-mono text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans">Shift Category</label>
                        <select
                          value={editShiftType}
                          onChange={(e) => setEditShiftType(e.target.value)}
                          className="cockpit-input w-full font-mono text-xs font-bold"
                        >
                          <option value="day">☀️ Day (0 pts)</option>
                          <option value="night">🌙 Night (+20 pts)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 font-mono">
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans">
                          Consecutive Days ({editConsecutiveDays})
                        </label>
                        <input
                          type="number"
                          min="1"
                          max="14"
                          required
                          value={editConsecutiveDays}
                          onChange={(e) => setEditConsecutiveDays(parseInt(e.target.value) || 1)}
                          className="cockpit-input w-full font-mono text-xs"
                        />
                      </div>

                      <div>
                        <label className="block text-slate-300 font-semibold mb-1 font-sans flex justify-between">
                          <span>Work Intensity *</span>
                          <span className="text-cyan-400 font-bold">+{WORKLOAD_OPTIONS.find(w => w.value === editWorkload)?.points} pts</span>
                        </label>
                        <select
                          value={editWorkload}
                          onChange={(e) => setEditWorkload(e.target.value)}
                          className="cockpit-input w-full font-mono font-bold text-xs"
                        >
                          {WORKLOAD_OPTIONS.map((opt) => (
                            <option key={opt.value} value={opt.value}>
                              {opt.label} (+{opt.points} pts)
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-300 font-semibold mb-1 font-sans">Sleep Duration (Hours in past 24h) *</label>
                      <input
                        type="number"
                        step="0.5"
                        min="0"
                        max="24"
                        required
                        value={editSleepHours}
                        onChange={(e) => setEditSleepHours(parseFloat(e.target.value) || 0)}
                        className="cockpit-input w-full font-mono font-bold text-sm text-cyan-300"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-300 font-semibold mb-1 font-sans">Duty Notes</label>
                      <input
                        type="text"
                        value={editEntryNotes}
                        onChange={(e) => setEditEntryNotes(e.target.value)}
                        className="cockpit-input w-full font-mono text-xs"
                      />
                    </div>

                    <div className="flex gap-3 pt-3 border-t border-[#1E3264]">
                      <button
                        type="button"
                        onClick={() => setShowEditEntryModal(false)}
                        className="btn-glass flex-1 py-2.5 text-xs"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="btn-cyber flex-1 py-2.5 text-xs font-bold"
                      >
                        Update Entry →
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* MODAL: DELETE FATIGUE ENTRY CONFIRMATION */}
            {/* ========================================================================= */}
            {showDeleteEntryModal && deletingEntry && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-panel p-7 max-w-md w-full space-y-5 bg-[#0e040a] border-rose-500/60 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-rose-950 pb-3.5">
                    <h3 className="text-base font-mono font-bold uppercase text-rose-400 flex items-center gap-2">
                      <span>🗑️</span>
                      <span>Remove Fatigue Entry</span>
                    </h3>
                    <button onClick={() => setShowDeleteEntryModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                  </div>

                  <div className="space-y-3 text-xs font-sans text-slate-300">
                    <p>
                      Are you sure you want to remove the fatigue record logged on <strong className="text-rose-300 font-mono">{deletingEntry.recordDate} at {deletingEntry.recordTime}</strong> (Score: {deletingEntry.fatigueScore})?
                    </p>
                    <div className="p-3 bg-rose-950/40 border border-rose-800/40 rounded-xl text-[11px] font-mono text-rose-300">
                      The entry will be removed from history and the Cartesian fatigue graph will automatically recalculate.
                    </div>
                  </div>

                  <div className="flex gap-3 pt-3 border-rose-950">
                    <button
                      type="button"
                      onClick={() => setShowDeleteEntryModal(false)}
                      className="btn-glass flex-1 py-2.5 text-xs"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmDeleteEntry}
                      className="btn-danger flex-1 py-2.5 text-xs font-bold"
                    >
                      Yes, Remove Entry
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================================= */}
            {/* GOOGLE FIREBASE CLOUD SYNC & AUTHENTICATION MODALS */}
            {/* ========================================================================= */}
            {renderCloudModal()}
            {renderAuthModal()}
            {renderUserManualModal()}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-[#1E3264]/70 bg-[#030712]/95 py-6 text-xs font-mono text-slate-400">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
              <div>
                <strong className="text-slate-200 font-bold">AeroFatigue</strong> — Ground Crew &amp; Air Crew Fatigue Management System
              </div>
              <div className="text-[11px] text-slate-500">
                Admin ID: <span className="text-purple-400 font-bold">{adminCreds.id}</span> • Cartesian Telemetry • Decision-Support Only
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CrewFatigueApp />);
  </script>
</body>
</html>
